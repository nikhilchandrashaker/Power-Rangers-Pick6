 $("tg").textContent=pending?`👆 Click an empty silhouette to place ${pending.character}`:team.length?`Team rating ${a.toFixed(1)} · Grade ${gradeOf(a)}`:"";}

$("skip").onclick=()=>{if(skips<1)return;skips--;pending=null;renderSlots();cur=null;seg=null;status();$("draft").disabled=$("skip").disabled=true;
 $("card").innerHTML='<p class="hint" style="padding:60px 0">Re-spin used. Spin again.</p>';$("spin").disabled=false;drawWheel(rot);};

const avg=(a,k)=>a.reduce((s,x)=>s+x[k],0)/a.length;
const mx=(a,k)=>Math.max(...a.map(x=>x[k]));
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function scoreLineup(t){
 const ov=avg(t,"overall"),off=avg(t,"offense"),def=avg(t,"defense"),sup=avg(t,"support"),clu=avg(t,"clutch");
 const core=ov*.4+(off+def+sup+clu)/4*.6,base=cl((core-LO)/(HI-LO),0,1)*62;
 let tp=0,ep=0;for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){if(t[i].team===t[j].team)tp++;else if(t[i].era===t[j].era)ep++;}
 const syn=Math.min(12,tp*4+ep*.75);
 const needs=[["Leader","an elite Leadership captain",mx(t,"leadership")>=PQ.leadership],["Brains","an elite Intelligence mind",mx(t,"intelligence")>=PQ.intelligence],["Speed","an elite Speed threat",mx(t,"speed")>=PQ.speed],["Muscle","an elite Power or Durability tank",mx(t,"power")>=PQ.power||mx(t,"durability")>=PQ.durability],["Closer","an elite Clutch finisher",mx(t,"clutch")>=PQ.clutch],["Support","an elite Support glue",mx(t,"support")>=PQ.support]];
 const cov=needs.filter(n=>n[2]).length*3.5,roles=new Set(t.map(x=>x.role)).size,div=roles>=5?5:roles>=4?2:0;
 const total=Math.round(cl(base+syn+cov+div,0,100));
 const g=total>=90?["S","Legendary Megazord Team"]:total>=80?["A","Ultimate Power Team"]:total>=70?["B","Solid Ranger Squad"]:total>=60?["C","Rookie Cadets"]:["D","Needs a Zord Upgrade"];
 return{total,grade:g,ov,off,def,sup,clu,tp,ep,syn,needs,cov,roles,div,base};}
function finish(replay){const s=scoreLineup(team);let dstreak=0;
 if(mode==="daily"){const sv=getDaily();if(replay&&sv)dstreak=sv.streak;else{dstreak=sv&&sv.date===yest()?sv.streak+1:1;try{localStorage.setItem("pr6daily",JSON.stringify({date:today(),total:s.total,ids:team.map(r=>r.id),streak:dstreak}))}catch(e){}}}
 let b=0;try{b=+localStorage.getItem("pr6best")||0;}catch(e){}
 if(!replay&&s.total>b){try{localStorage.setItem("pr6best",String(s.total))}catch(e){}}
 const top=[...team].sort((a,b)=>b.overall-a.overall)[0];
 const bars=[["Overall",s.ov,"overall"],["Offense",s.off,"offense"],["Defense",s.def,"defense"],["Support",s.sup,"support"],["Clutch",s.clu,"clutch"],["Leadership",avg(team,"leadership"),"leadership"],["Intelligence",avg(team,"intelligence"),"intelligence"],["Teamwork",avg(team,"teamwork"),"teamwork"]];
 $("res").innerHTML=`<div class="rc" style="flex-wrap:wrap"><div><div style="display:flex;gap:22px;align-items:flex-end"><div><div class="big">${s.total}</div><div class="meta">SCORE / 100</div></div><div><div class="big" style="color:var(--acc)">${gradeOf(s.ov)}</div><div class="meta">TEAM GRADE · avg ${s.ov.toFixed(1)}</div></div></div><div class="grade" style="margin-top:6px">Rank ${s.grade[0]} · ${s.grade[1]}</div>
 <div class="meta">${!replay&&s.total>b?"🏆 New best score!":"Best: "+Math.max(b,s.total)}</div>${mode==="daily"?`<div class="meta">📅 Daily ${today()} · 🔥 ${dstreak}-day streak</div>`:""}</div>
 <div style="flex:1;min-width:240px"><div class="stats">${bars.map(([n,v,k])=>`<div class="st">${n}<b>${v.toFixed(1)} · ${gradeOf(v,k)}</b><div class="bar"><i style="width:${v}%"></i></div></div>`).join("")}</div></div></div>
 <ul><li>Base strength: <b>${s.base.toFixed(1)}</b> / 62 · Chemistry: <b>${s.syn.toFixed(1)}</b> / 12 (${s.tp} same-team pairs, ${s.ep} same-era pairs)</li>
 <li>Role coverage: <b>${s.cov.toFixed(1)}</b> / 21 · Variety bonus: <b>${s.div}</b> (${s.roles} different roles)</li>
 ${s.needs.map(n=>`<li class="${n[2]?"good":""}">${n[2]?"✔":"✘"} ${n[0]}: ${n[2]?"covered":"missing "+n[1]}</li>`).join("")}
 <li>MVP: <b>${top.character}</b> (${top.form}, ${top.overall} OVR)</li></ul>
 <div class="row"><select id="diff"><option value="4">CPU: Easy</option><option value="12" selected>CPU: Normal</option><option value="99">CPU: Hard</option></select><button id="battle">⚔️ BATTLE THE CPU</button></div><div id="vs"></div>
 <div class="row"><button id="again">PLAY AGAIN</button><button class="alt" id="copy">COPY RESULT</button></div>`;
 $("res").style.display="block";if(!replay)$("res").scrollIntoView({behavior:"smooth"});bestTxt();
 $("again").onclick=()=>{if(mode==="daily")setMode("free");else newGame();};$("battle").onclick=()=>battle(s);
 $("copy").onclick=()=>{const t=(mode==="daily"?`📅 Pick 6 Daily ${today()} · 🔥${dstreak}\n`:"⚡ ")+`Power Rangers Pick 6: ${s.total}/100 · Team Grade ${gradeOf(s.ov)} (${s.grade[0]}, ${s.grade[1]})\n`+team.map(r=>`• ${r.character} – ${r.form} (${r.overall})`).join("\n")+(mode==="daily"?"\n"+team.map(r=>EMO[r.rarity]).join(""):"");
  try{navigator.clipboard.writeText(t);$("copy").textContent="COPIED!";}catch(e){$("copy").textContent="COPY FAILED";}};}
function rec(){try{return JSON.parse(localStorage.getItem("pr6rec"))||{w:0,l:0,d:0}}catch(e){return{w:0,l:0,d:0}}}
function cpuTeam(n){const t=[],used=new Set();let sk=2;while(t.length<6){let wi=Math.floor(Math.random()*S),g;
 while(!(g=grp(SEGS[wi],used)).length)wi=(wi+1)%S;
 const seen=new Set(),c=g.sort(()=>Math.random()-.5).filter(r=>!seen.has(r.character)&&seen.add(r.character));let b;
 if(n>=99){if(sk>0&&Math.max(...c.map(r=>r.overall))<(t.length<3?93:90)){sk--;continue;}b=c.map(r=>({r,v:scoreLineup([...t,r]).total})).sort((x,y)=>y.v-x.v)[0].r;}
 else b=c.slice(0,n).sort((x,y)=>y.overall-x.overall)[0];
 t.push(b);used.add(b.character);}return t;}
function battle(ps){$("battle").disabled=$("diff").disabled=true;const cpu=cpuTeam(+$("diff").value),cs=scoreLineup(cpu);
 const cats=[["Overall","overall"],["Offense","offense"],["Defense","defense"],["Support","support"],["Clutch","clutch"],["Leadership","leadership"],["Intelligence","intelligence"],["Teamwork","teamwork"],["Speed","speed"]].map(([l,k])=>[l,avg(team,k),avg(cpu,k),1]);
 cats.push(["FINAL SCORE",ps.total,cs.total,3]);
 const vs=$("vs");vs.innerHTML=`<h2 style="margin-top:14px">CPU lineup · Team Grade ${gradeOf(cs.ov)} (avg ${cs.ov.toFixed(1)})</h2><div class="meta">${cpu.map(r=>`${r.character} (${r.overall})`).join(" · ")}</div><div style="margin-top:10px" id="vrows"></div>`;
 let a=0,b=0,i=0;(function nx(){if(i<cats.length){const [l,x,y,w]=cats[i++],xa=Math.round(x*10)/10,ya=Math.round(y*10)/10;
  if(xa>ya)a+=w;else if(ya>xa)b+=w;
  $("vrows").insertAdjacentHTML("beforeend",`<div class="vr"><span class="a ${xa>ya?"w":""}">${xa>ya?"✔ ":""}${xa.toFixed(1)}</span><span class="l">${l}${w>1?" (x"+w+")":""}</span><span class="${ya>xa?"w":""}">${ya.toFixed(1)}${ya>xa?" ✔":""}</span></div>`);setTimeout(nx,450);}
  else{const r=rec(),res=a>b?"w":b>a?"l":"d";r[res]++;try{localStorage.setItem("pr6rec",JSON.stringify(r))}catch(e){}bestTxt();
   vs.insertAdjacentHTML("beforeend",`<div class="verdict">${a>b?"🏆 VICTORY":b>a?"💥 DEFEAT":"🤝 DRAW"} ${a}–${b}</div><div class="row"><button class="alt" onclick="$('battle').disabled=$('diff').disabled=false;$('battle').click()">REMATCH (new CPU team)</button></div>`);}})();}
const sel=(id,label,vals)=>{$(id).innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${v}</option>`).join("");$(id).onchange=renderPool;};
sel("fs","All seasons",[...new Set(R.map(r=>r.season))]);sel("fc","All colors",[...new Set(R.map(r=>r.color))]);
sel("fr","All rarities",["Legendary","Elite","Rare","Uncommon","Common"]);sel("fy","All roles",[...new Set(R.map(r=>r.role))].sort());
$("q").oninput=renderPool;$("so").onchange=renderPool;
function renderPool(){const q=$("q").value.toLowerCase(),k=$("so").value;
 let l=R.filter(r=>(!q||(r.character+" "+r.form).toLowerCase().includes(q))&&(!$("fs").value||r.season===$("fs").value)&&(!$("fc").value||r.color===$("fc").value)&&(!$("fr").value||r.rarity===$("fr").value)&&(!$("fy").value||r.role===$("fy").value));
 l.sort((a,b)=>k==="character"?a.character.localeCompare(b.character):k==="year"?a.year-b.year||a.id.localeCompare(b.id):b[k]-a[k]);
 $("pcount").textContent=`(${l.length} of ${R.length})`;
 $("pl").innerHTML=l.map(r=>`<div class="pr" data-id="${r.id}"><div class="sw" style="background:${cc(r.color)}"></div><div class="nm"><b>${r.character}</b><span class="meta">${r.form} · ${r.season}</span></div><span class="badge ${r.rarity}">${r.rarity}</span><span class="meta">${r.role}</span><span class="o">${r[k]&&k!=="character"&&k!=="year"?r[k]:r.overall}</span></div>`).join("")||'<p class="hint">No Rangers match.</p>';
 $("pl").querySelectorAll(".pr").forEach(e=>e.onclick=()=>{$("pdet").innerHTML=cardHTML(R.find(r=>r.id===e.dataset.id));$("pdet").scrollIntoView({behavior:"smooth",block:"nearest"});});}
$("browse").onclick=()=>{const p=$("pool"),o=p.style.display==="block";p.style.display=o?"none":"block";$("browse").textContent=o?"📖 Browse all Rangers":"✖ Close pool";if(!o){renderPool();p.scrollIntoView({behavior:"smooth"});}};
newGame();
</script></body></html>
